[package]
name = "thingamaroo-core"
description = "Byte-level continual-learning language model: model, memory, learning and sleep."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Cross-platform GPU compute through wgpu (Vulkan, Metal or DirectX 12).
gpu = ["burn/wgpu"]
# NVIDIA CUDA compute. Requires the CUDA toolkit at build time.
cuda = ["burn/cuda"]

[dependencies]
burn.workspace = true
half.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
burn.workspace = true
