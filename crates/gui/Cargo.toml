[package]
name = "thingamaroo-gui"
description = "Desktop front end for the byte-level continual-learning language model."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "../link_libtorch.rs"

[[bin]]
name = "thingamaroo-gui"
path = "src/main.rs"

[features]
default = ["fast-allocator", "libtorch"]
# Replaces the system allocator with mimalloc, which roughly doubles CPU
# training speed. Needs a C compiler at build time; disable it if none is available.
fast-allocator = ["dep:mimalloc"]
gpu = ["thingamaroo-core/gpu"]
cuda = ["thingamaroo-core/cuda"]
# Trains on the processor through LibTorch, PyTorch's C++ engine, about twice as
# fast as the pure-Rust backend. Build with --no-default-features (plus
# --features fast-allocator) for a self-contained pure-Rust program.
libtorch = ["thingamaroo-core/libtorch", "dep:torch-sys"]

[dependencies]
thingamaroo-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "wgpu", "x11"] }
egui = "0.37"
egui_plot = "0.38"
rfd = "0.18"
serde_json.workspace = true
mimalloc = { version = "0.1", optional = true }
# Not used in code: depending on it directly lets build.rs learn where LibTorch is.
torch-sys = { version = "0.22", optional = true }
