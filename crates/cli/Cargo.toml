[package]
name = "thingamaroo-cli"
description = "Command-line front end for the byte-level continual-learning language model."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "thingamaroo"
path = "src/main.rs"

[features]
default = ["fast-allocator"]
# Replaces the system allocator with mimalloc, which roughly doubles CPU
# training speed. Needs a C compiler at build time; disable it if none is available.
fast-allocator = ["dep:mimalloc"]
gpu = ["thingamaroo-core/gpu"]
cuda = ["thingamaroo-core/cuda"]

[dependencies]
thingamaroo-core.workspace = true
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
serde_json.workspace = true
mimalloc = { version = "0.1", optional = true }
