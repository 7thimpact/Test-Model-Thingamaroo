[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/7thimpact/Test-Model-Thingamaroo"

[workspace.dependencies]
thingamaroo-core = { path = "crates/core" }
burn = { version = "0.22.1", features = ["flex", "simd", "rayon"] }
half = "2.7"
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3

# Tensor kernels are unusably slow without optimisation, so dependencies are
# always built optimised even for `cargo test` and debug runs.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
